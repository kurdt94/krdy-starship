"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#585858)\
[💀](bg:#585858 fg:#ffffff)\
[](bg:#444444 fg:#585858)\
$directory\
[](fg:#444444 bg:#303030)\
$git_branch\
$git_status\
[](fg:#303030 bg:#1c1c1c)\
$time\
[ ](fg:#1c1c1c)\
\n$character"""

[directory]
style = "fg:#e4e4e4 bg:#444444"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#303030 fg:#c6c6c6"
format = '[[ $symbol $branch ](fg:#c6c6c6 bg:#303030)]($style)'

[git_status]
style = "bg:#303030 fg:#c6c6c6"
format = '[[($all_status$ahead_behind )](fg:#c6c6c6 bg:#303030)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1c1c1c fg:#505050"
format = '[[  $time ](fg:#505050 bg:#1c1c1c)]($style)'
